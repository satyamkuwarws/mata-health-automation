[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --disable-warnings
markers =
    smoke: fast, critical path tests
    regression: broad UI regression suite
    e2e: end-to-end flows across modules
    slow: long-running tests
    api: API-focused tests / setup validation
filterwarnings =
    ignore::DeprecationWarning

