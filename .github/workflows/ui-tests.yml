name: UI Tests (Playwright Sync)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    env:
      # Inject secrets in repo settings; do NOT commit real values.
      BASE_URL: ${{ secrets.BASE_URL }}
      # For OTP auth, provide a pre-generated Playwright storage state JSON as a secret.
      # Create it locally via: `python3 scripts/save_storage_state.py ...`
      # Then copy the JSON contents into this secret.
      STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
      BROWSER: ${{ matrix.browser }}
      HEADLESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run smoke tests (parallel)
        run: |
          mkdir -p reports/allure-results
          mkdir -p reports/artifacts/storage
          if [ -z "${STORAGE_STATE_JSON}" ]; then
            echo "Missing STORAGE_STATE_JSON secret. Generate storage state locally and set it in repo secrets." >&2
            exit 1
          fi
          printf "%s" "${STORAGE_STATE_JSON}" > reports/artifacts/storage/storage_state_master.json
          pytest -m smoke \
            --browser "${{ matrix.browser }}" \
            --reruns 2 --reruns-delay 1 \
            --alluredir "reports/allure-results" \
            -n auto

      - name: Upload reports/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ matrix.browser }}
          path: |
            reports/

